# Nemotron-3 Super 120B A12B BF16 attention/KV with BF16 lm_head isolate.
# This is a diagnostic config derived from nemotron-super-bf16kv-a16.conf:
# CFG_LM_HEAD_QUANT changes from int8 to bf16 so first-token witness failures
# can be separated from the common Nemotron forward path. The port is also
# separate so this isolate can coexist with existing diagnostic configs.
MODEL_PATH="/home/main/.krasis/models/NVIDIA-Nemotron-3-Super-120B-A12B-BF16"
CFG_SELECTED_GPUS="0"
CFG_PP_PARTITION="88"
CFG_LAYER_GROUP_SIZE="2"
CFG_KV_DTYPE="bf16"
CFG_GPU_EXPERT_BITS="4"
CFG_CPU_EXPERT_BITS="4"
CFG_ATTENTION_QUANT="bf16"
CFG_SHARED_EXPERT_QUANT="int8"
CFG_DENSE_MLP_QUANT="int8"
CFG_LM_HEAD_QUANT="bf16"
CFG_KRASIS_THREADS="40"
CFG_HOST="0.0.0.0"
CFG_PORT="18022"
CFG_ENABLE_THINKING="0"
CFG_GPU_PREFILL_THRESHOLD="300"
CFG_VRAM_SAFETY_MARGIN="600"
CFG_GGUF_PATH=""
CFG_FORCE_LOAD=""
