name: Build Release

on:
  release:
    types: [published]
  workflow_dispatch:  # Manual trigger for testing builds

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Linux release artifacts
        env:
          KRASIS_GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          docker run --rm --init \
            -e GH_TOKEN -e KRASIS_GITHUB_REPOSITORY \
            -e GITHUB_SHA -e GITHUB_REF_NAME -e GITHUB_REPOSITORY \
            -e HTTP_PROXY -e HTTPS_PROXY -e NO_PROXY \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --workdir "$GITHUB_WORKSPACE" \
            quay.io/pypa/manylinux_2_28_x86_64:latest \
            bash scripts/build-release-linux.sh

      - name: Upload sidecar bundle cache asset
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f target/sidecars/upload_bundle_required ]; then
            echo "No new sidecar bundle was compiled; skipping sidecar bundle upload."
            exit 0
          fi
          bundle_name=$(cat target/sidecars/upload_bundle_required)
          bundle_path="target/sidecars/bundles/${bundle_name}"
          if [ ! -f "$bundle_path" ]; then
            echo "ERROR: expected sidecar bundle not found: $bundle_path" >&2
            find target/sidecars -maxdepth 3 -type f -print 2>/dev/null || true
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "$bundle_path" --clobber

      - name: Inject vendored sidecars into wheels
        run: |
          start=$(date +%s)
          set +e
          python3 <<'PY'
          from pathlib import Path
          import json
          import subprocess
          import os
          import zipfile

          wheel_dir = Path("dist")
          wheels = sorted(wheel_dir.glob("*.whl"))
          if not wheels:
              raise SystemExit("no wheels found in dist")

          required = {
              "krasis/libkrasis_marlin.so",
              "krasis/libkrasis_flash_attn.so",
              "krasis/fla_sidecar_contract.json",
              "krasis/sidecar_manifest.json",
          }
          # FLA .so files are expected for each target architecture. Release
          # prebuild requires all of these, so missing entries indicate a
          # packaging problem rather than an optional downgrade.
          fla_contract = json.loads(
              Path("python/krasis/fla_sidecar_contract.json").read_text(
                  encoding="utf-8"
              )
          )
          if fla_contract.get("schema_version") != 1:
              raise SystemExit("invalid FLA sidecar contract schema")
          fla_archs = [int(arch) for arch in fla_contract["architectures"]]
          if not fla_archs or len(set(fla_archs)) != len(fla_archs):
              raise SystemExit("invalid FLA sidecar architecture inventory")
          for arch in fla_archs:
              required.add(f"krasis/libkrasis_fla_sm{arch}.so")

          missing = []
          for wheel in wheels:
              with zipfile.ZipFile(wheel) as zf:
                  names = set(zf.namelist())
              absent = sorted(required - names)
              if absent:
                  print(f"{wheel.name}: missing {', '.join(absent)}")
                  missing.append(wheel)
              else:
                  print(f"{wheel.name}: vendored sidecars already present")

          if not missing:
              print("All wheels already contain vendored sidecars; skipping injection.")
          else:
              def find_sidecar(name: str) -> Path | None:
                  for path in Path(".").rglob(name):
                      path_str = path.as_posix()
                      if path_str.startswith("dist/") or "/dist/" in path_str:
                          continue
                      return path
                  return None

              marlin = find_sidecar("libkrasis_marlin.so")
              flash_attn = find_sidecar("libkrasis_flash_attn.so")
              manifest = find_sidecar("sidecar_manifest.json")
              if marlin is None or flash_attn is None or manifest is None:
                  missing_names = []
                  if marlin is None:
                      missing_names.append("libkrasis_marlin.so")
                  if flash_attn is None:
                      missing_names.append("libkrasis_flash_attn.so")
                  if manifest is None:
                      missing_names.append("sidecar_manifest.json")
                  raise SystemExit(
                      "wheel sidecars missing and local copies not found: "
                      + ", ".join(missing_names)
                  )

              # Find FLA .so directory (required — FLA must be compiled in before-script-linux)
              fla_so = find_sidecar("libkrasis_fla_sm80.so")
              if fla_so is None:
                  raise SystemExit(
                      "FLA .so files not found — FLA compilation in before-script-linux failed"
                  )
              fla_dir = str(fla_so.parent)

              cmd = [
                  "python3",
                  "scripts/inject_wheel_sidecars.py",
                  "--wheel-dir",
                  str(wheel_dir),
                  "--marlin",
                  str(marlin),
                  "--flash-attn",
                  str(flash_attn),
                  "--manifest",
                  str(manifest),
                  "--fla-dir",
                  fla_dir,
              ]

              subprocess.run(cmd, check=True)
          subprocess.run([
              "python3",
              "scripts/build_sidecars.py",
              "verify-wheel",
              "--wheel-dir",
              str(wheel_dir),
          ], check=True, env={**dict(os.environ), "KRASIS_DEV_SCRIPT": "1"})
          PY
          status=$?
          set -e
          end=$(date +%s)
          echo "KRASIS_BUILD_TIMING phase=\"release inject sidecars\" status=$status duration_s=$((end - start))"
          exit "$status"

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber

      - name: Upload artifacts (CI debugging)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
