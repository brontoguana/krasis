name: Build Windows Installer

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-2022
    timeout-minutes: 240
    defaults:
      run:
        shell: pwsh
    env:
      KRASIS_DEV_SCRIPT: "1"
      KRASIS_SIDECAR_PLATFORM: windows-x86_64-cuda126
      KRASIS_WINDOWS_PYTHON_VERSION: "3.12.10"
      KRASIS_WINDOWS_PYTHON_ARCHIVE_SHA256: "4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3"
      KRASIS_WINDOWS_TORCH_VERSION: "2.9.1+cu128"
      KRASIS_WINDOWS_TORCH_CUDA: "12.8"
      KRASIS_WINDOWS_TORCH_URL: "https://download-r2.pytorch.org/whl/cu128/torch-2.9.1%2Bcu128-cp312-cp312-win_amd64.whl#sha256=3a01f0b64c10a82d444d9fd06b3e8c567b1158b76b2764b8f51bfd8f535064b0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "12.6.3"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin
          choco install innosetup -y --no-progress

      - name: Build Windows sidecar DLLs
        run: |
          nvcc --version
          python scripts/build_sidecars.py build --force
          python scripts/build_sidecars.py verify
          Get-ChildItem python/krasis -Filter "*.dll" | Format-Table Name,Length

      - name: Build Windows wheel
        run: |
          python -m maturin build --release --out dist -i python
          python scripts/build_sidecars.py verify-wheel --wheel-dir dist

      - name: Build installer wheelhouse
        run: |
          New-Item -ItemType Directory -Force -Path wheelhouse | Out-Null
          $wheel = Get-ChildItem dist -Filter "krasis-*.whl" | Select-Object -First 1
          if (-not $wheel) {
            throw "No Krasis wheel found in dist"
          }
          python -m pip download `
            --dest wheelhouse `
            --requirement scripts/windows/windows-runtime-requirements.txt `
            $wheel.FullName
          Get-ChildItem wheelhouse | Format-Table Name,Length

      - name: Download embedded Python runtime
        run: |
          $pyver = $env:KRASIS_WINDOWS_PYTHON_VERSION
          $url = "https://www.python.org/ftp/python/$pyver/python-$pyver-embed-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile python-runtime.zip
          Get-Item python-runtime.zip | Format-Table Name,Length

      - name: Build private Windows runtime
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $buildPython = (Get-Command python).Source
          scripts/windows/Build-Runtime.ps1 `
            -Wheelhouse wheelhouse `
            -PythonRuntimeArchive python-runtime.zip `
            -BuildPython $buildPython `
            -RuntimeRequirements scripts/windows/windows-runtime-requirements.txt `
            -OutputDir runtime-package `
            -Version $version `
            -PythonVersion $env:KRASIS_WINDOWS_PYTHON_VERSION `
            -PythonRuntimeArchiveSha256 $env:KRASIS_WINDOWS_PYTHON_ARCHIVE_SHA256 `
            -TorchVersion $env:KRASIS_WINDOWS_TORCH_VERSION `
            -TorchCuda $env:KRASIS_WINDOWS_TORCH_CUDA `
            -TorchUrl $env:KRASIS_WINDOWS_TORCH_URL
          Get-Content runtime-package/runtime-manifest.json

      - name: Build installer
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          scripts/windows/Build-Installer.ps1 `
            -RuntimePackage runtime-package `
            -OutputDir dist `
            -Version $version
          Get-ChildItem dist | Format-Table Name,Length

      - name: Test clean install, isolation, legacy repair, and uninstall
        run: |
          $installer = Get-ChildItem dist -Filter "KrasisSetup-*-win64.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "No Krasis Windows installer was built."
          }

          $testRoot = Join-Path $env:RUNNER_TEMP "krasis-private-runtime-test"
          Remove-Item -Recurse -Force $testRoot -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path (Join-Path $testRoot "python") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $testRoot "venv") | Out-Null
          Set-Content (Join-Path $testRoot "python\legacy-313-runtime.txt") "legacy"
          Set-Content (Join-Path $testRoot "venv\legacy-313-venv.txt") "legacy"

          Remove-Item -Recurse -Force target, wheelhouse, runtime-package -ErrorAction SilentlyContinue
          Get-PSDrive C | Format-Table Name,Used,Free

          $installLog = Join-Path $env:RUNNER_TEMP "krasis-installer-test.log"
          $process = Start-Process `
            -FilePath $installer.FullName `
            -ArgumentList @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART",
              "/DIR=$testRoot",
              "/LOG=$installLog"
            ) `
            -PassThru `
            -Wait
          if (Test-Path $installLog) {
            Get-Content $installLog
          } else {
            Write-Warning "Inno Setup did not create the requested install log: $installLog"
          }
          Write-Host "Requested install-root contents:"
          if (Test-Path $testRoot) {
            Get-ChildItem -Force -Recurse $testRoot |
              Select-Object FullName,Length |
              Format-Table -AutoSize
          } else {
            Write-Warning "Requested install root does not exist: $testRoot"
          }
          $runtimeInstallLog = Join-Path $testRoot "runtime-install.log"
          if (Test-Path $runtimeInstallLog) {
            Write-Host "Krasis private-runtime install transcript:"
            Get-Content $runtimeInstallLog
          } else {
            Write-Warning "Private-runtime install transcript is missing: $runtimeInstallLog"
          }
          if ($process.ExitCode -ne 0) {
            throw "Private-runtime installer test failed with status $($process.ExitCode)."
          }

          $env:PYTHONHOME = "C:\definitely-not-krasis-python"
          $env:PYTHONPATH = "C:\hostile-system-site-packages"
          scripts/windows/Test-InstalledRuntime.ps1 -InstallRoot $testRoot
          Remove-Item Env:PYTHONHOME,Env:PYTHONPATH -ErrorAction SilentlyContinue

          if (Test-Path (Join-Path $testRoot "python")) {
            throw "Installer retained the legacy Python directory."
          }
          if (Test-Path (Join-Path $testRoot "venv")) {
            throw "Installer retained the legacy venv directory."
          }

          $uninstaller = Join-Path $testRoot "unins000.exe"
          $uninstall = Start-Process `
            -FilePath $uninstaller `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") `
            -PassThru `
            -Wait
          if ($uninstall.ExitCode -ne 0) {
            throw "Private-runtime uninstall test failed with status $($uninstall.ExitCode)."
          }
          if (Test-Path (Join-Path $testRoot "runtime")) {
            throw "Uninstall retained the private runtime."
          }

          Copy-Item -Force $installLog dist/windows-installer-test.log
          Get-PSDrive C | Format-Table Name,Used,Free

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krasis-windows-installer
          path: |
            dist/KrasisSetup-*-win64.exe
            dist/Krasis-Windows-Package-*.zip
            dist/*.whl
            dist/windows-installer-test.log
            ${{ runner.temp }}/krasis-installer-test.log
            ${{ runner.temp }}/krasis-private-runtime-test/runtime-install.log

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist/KrasisSetup-*-win64.exe dist/*.whl --clobber
