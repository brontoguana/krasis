[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "krasis"
version = "1.0.21-rc.7"
description = "LLM runtime for large MoE models with GPU prefill, GPU decode, and measured VRAM management"
license = {text = "SSPL-1.0"}
requires-python = ">=3.10"
readme = "README.md"
keywords = ["llm", "inference", "moe", "gpu", "cpu"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: Other/Proprietary License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "safetensors>=0.4",
    "numpy>=1.24",
    "Pillow>=10",
    "transformers>=4.40",
    "huggingface-hub>=0.24",
]

[project.optional-dependencies]
gpu = []  # Marlin GEMM kernels are now vendored (libkrasis_marlin.so)

[project.urls]
Homepage = "https://github.com/brontoguana/krasis"
Repository = "https://github.com/brontoguana/krasis"

[project.scripts]
krasis = "krasis.launcher:main"
krasis-chat = "krasis.chat:main"
krasis-setup = "krasis.setup:main"

[tool.maturin]
features = ["pyo3/extension-module", "cuda"]
python-source = "python"
module-name = "krasis.krasis"
include = [
    {path = "python/krasis/prompts/*", format = "wheel"},
    {path = "python/krasis/chat_templates/*", format = "wheel"},
    {path = "python/krasis/libkrasis*.so", format = "wheel"},
    {path = "python/krasis/*.dll", format = "wheel"},
    {path = "python/krasis/fla_sidecar_contract.json", format = "wheel"},
    {path = "python/krasis/sidecar_manifest.json", format = "wheel"},
]
