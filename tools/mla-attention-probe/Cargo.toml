[package]
name = "mla-attention-probe"
version = "0.1.0"
edition = "2021"
[dependencies]
cudarc = { path = "../../vendor/cudarc", features = ["driver", "cublas", "cublaslt", "f16", "cuda-12060"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
[profile.release]
opt-level = 3
